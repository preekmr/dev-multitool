name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:manifest
      - run: npm test
      - run: npx vsce package --out dev-multitool.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: dev-multitool-vsix
          path: dev-multitool.vsix
