name: Publish to Open VSX

# Publishes the .vsix attached to a GitHub release to open-vsx.org (used by VSCodium, Cursor,
# Windsurf, Gitpod, Eclipse Theia and others).
#
# - Runs automatically after the Release workflow succeeds (publishes the latest release).
# - Can be started by hand from the Actions tab for an older release or to retry.
#
# Needs the repository secret OVSX_PAT (an open-vsx.org access token). Once the extension exists on
# Open VSX and the namespace is verified, this workflow can switch to Open VSX Trusted Publishing:
# register this file (openvsx.yml) as a trusted publisher and drop the secret.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0 (empty = latest release)
        required: false

permissions:
  contents: read
  id-token: write # for Open VSX Trusted Publishing, once set up

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the .vsix from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Publishing $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir release

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Add the OVSX_PAT repository secret (an open-vsx.org access token)."
            exit 1
          fi
          # Ignore stray whitespace/newlines pasted along with the token.
          OVSX_PAT="$(printf '%s' "$OVSX_PAT" | tr -d '[:space:]')"
          export OVSX_PAT
          namespace=$(node -p "require('./package.json').publisher")
          hint="Check the OVSX_PAT secret: create a new token at https://open-vsx.org/user-settings/tokens while logged in as the namespace owner, after signing the Publisher Agreement."

          # Create the namespace only if it does not exist yet. Tokens scoped to "publishing only"
          # cannot create namespaces, so don't call create-namespace when it isn't needed.
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$namespace")
          if [ "$status" = "404" ]; then
            echo "Creating Open VSX namespace $namespace"
            if ! npx --yes ovsx@1.4.0 create-namespace "$namespace"; then
              echo "::error::Could not create Open VSX namespace '$namespace'. Create it on open-vsx.org (Settings → Namespaces) or use a token that may create namespaces. $hint"
              exit 1
            fi
          else
            echo "Namespace $namespace exists (HTTP $status)."
          fi

          if ! npx --yes ovsx@1.4.0 publish --packagePath release/*.vsix --skip-duplicate; then
            echo "::error::Publishing to Open VSX failed. $hint"
            exit 1
          fi
